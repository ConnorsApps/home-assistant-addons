name: Home Assistant Backup
version: "0.1.1"
slug: hass_backup
description: Scheduled backups to S3-compatible storage, Google Cloud Storage, or a local folder
url: https://github.com/ConnorsApps/home-assistant-backup
image: ghcr.io/connorsapps/ha-addon-hass-backup
arch:
  - aarch64
  - amd64
init: false # the base image's s6-overlay is the init
# The Supervisor's /backups API; the Core proxy blocks the download path.
hassio_api: true
hassio_role: backup
map:
  - type: share
    read_only: false
  - type: addon_config
    read_only: true
    path: /config
options:
  schedule: "0 3 * * *"
  storage_url: "file:///share/hass-backups"
  storage_prefix: "home-assistant/"
  retention_keep_last: 30
  delete_after_transfer: true
  timeout: "30m"
  log_level: info
schema:
  schedule: str
  storage_url: str
  storage_prefix: str
  retention_keep_last: int(0,)
  delete_after_transfer: bool
  timeout: str
  log_level: list(debug|info|warn|error)
  aws_endpoint_url: str?
  aws_region: str?
  aws_access_key_id: str?
  aws_secret_access_key: password?
  google_credentials_file: str?
