configuration:
  schedule:
    name: Schedule
    description: Cron expression, e.g. "0 3 * * *" for 03:00 daily. Empty runs one backup per app start.
  storage_url:
    name: Storage URL
    description: file:///share/hass-backups, s3://bucket, or gs://bucket. Add ?use_path_style=true for MinIO or Ceph.
  storage_prefix:
    name: Storage prefix
    description: Prefix on every uploaded file.
  retention_keep_last:
    name: Backups to keep
    description: Delete older uploads beyond this count. 0 keeps everything.
  delete_after_transfer:
    name: Delete from Home Assistant after upload
    description: Remove the backup from Home Assistant once uploaded.
  timeout:
    name: Timeout
    description: Limit for creating, and separately for downloading and uploading (e.g. "30m", "1h30m").
  log_level:
    name: Log level
    description: Log verbosity.
  aws_endpoint_url:
    name: S3 endpoint URL
    description: For S3-compatible services such as MinIO. Empty for AWS.
  aws_region:
    name: S3 region
    description: e.g. us-east-1.
  aws_access_key_id:
    name: S3 access key ID
    description: Access key for S3.
  aws_secret_access_key:
    name: S3 secret access key
    description: Secret key for S3.
  google_credentials_file:
    name: Google credentials file
    description: Service account key JSON for gs://, in the app's config folder (e.g. "gcs.json").
