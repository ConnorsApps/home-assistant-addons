name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        run: pipx run yamllint .

  addon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hass-backup, frigate-notifications]
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.app }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x --severity=warning */run.sh

  # Fails on a missing upstream tag or a broken COPY.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hass-backup, frigate-notifications]
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build ${{ matrix.app }}
