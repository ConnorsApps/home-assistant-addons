# yaml-language-server: $schema=https://raw.githubusercontent.com/ConnorsApps/frigate-notifications/main/config.schema.json

# https://github.com/ConnorsApps/frigate-notifications
# Set by the app, not here: hass, mqtt (add an `mqtt:` block to use another
# broker instead of the Mosquitto app), and media (Configuration tab). slack,
# ntfy, redis and db can be set here or in the Configuration tab, which wins.
# Hours and dusk/dawn follow Home Assistant's time zone; add `timezone:` only to
# override it.

dashboardPath: /lovelace/frigate # opened when a Home Assistant notification is tapped
dashboardURL: https://homeassistant.example.com/lovelace/frigate # for Slack, ntfy, Discord
dryRun: false

recipients:
  alice:
    targets:
      - { type: hass, service: mobile_app_alice_phone } # notify.<service>
      # - { type: slack, channel: U0123ABCD }
      # - { type: ntfy, topic: alice-frigate }
      # - { type: discord, webhookURL: 'https://discord.com/api/webhooks/000000/example' }
    allowCritical: true
    maxPerHour: 8
    activeHours: { from: 7am, to: 10pm } # outside it, only critical gets through

# Only cameras listed here notify; keys are Frigate camera names.
cameras:
  front_porch:
    friendlyName: Front Porch
    liveViewEntity: camera.front_porch

# First match wins; position is priority.
rules:
  - name: night-person
    when:
      hours: { from: dusk+30m, to: dawn-30m }
      labels: [person]
      severity: [alert]
    holdoff: 5s
    cooldown: 5m
    cooldownScope: rule
    to: [alice]
    preset: liveview
    critical: true

  - name: day
    when:
      hours: { from: dawn-30m, to: dusk+30m }
      labels: [person, dog, package]
      severity: [alert]
    cooldown: 30s
    cooldownScope: rule
    to: [alice]

logLevel: info
