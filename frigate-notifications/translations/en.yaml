configuration:
  frigate_url:
    name: Frigate URL
    description: Frigate's unauthenticated API (port 5000), for snapshots and clips. Media also needs the public URL.
  public_base_url:
    name: Public URL for media
    description: Address phones use to reach port 8081, e.g. https://frigate-notifications.example.com.
  media_signing_key:
    name: Media signing key
    description: Hex, 32+ characters. Empty uses a key generated on first start. Changing it breaks links already sent.
  slack_bot_token:
    name: Slack bot token
    description: xoxb-... with chat:write. Overrides config.yaml.
  ntfy_url:
    name: ntfy server URL
    description: Overrides config.yaml. ntfy 2.16+ updates notifications in place.
  ntfy_token:
    name: ntfy access token
    description: Overrides config.yaml. Empty for open topics.
  db_url:
    name: Database URL
    description: postgres:// or mongodb:// audit log. Overrides config.yaml.
  redis_url:
    name: Redis URL
    description: Keeps cooldowns and state across restarts. Overrides config.yaml.
