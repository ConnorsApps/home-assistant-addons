name: Frigate Notifications
version: "0.1.1"
slug: frigate_notifications
description: Rule-based Frigate notifications via Home Assistant, Slack, ntfy, and Discord
url: https://github.com/ConnorsApps/frigate-notifications
image: ghcr.io/connorsapps/ha-addon-frigate-notifications
arch:
  - aarch64
  - amd64
init: false # the base image's s6-overlay is the init
homeassistant_api: true
services:
  - mqtt:want # an external broker can be set in config.yaml instead
# Media links must open off the LAN without a Home Assistant login, so not ingress.
ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: Signed media links (put a reverse proxy or tunnel in front)
map:
  - type: addon_config
    read_only: false
    path: /config
schema:
  frigate_url: str?
  public_base_url: url?
  media_signing_key: password?
  slack_bot_token: password?
  ntfy_url: url?
  ntfy_token: password?
  db_url: password?
  redis_url: password?
